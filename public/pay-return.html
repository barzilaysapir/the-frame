<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Frame</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0f;
        color: #c8c8d0;
        font: 15px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>חוזרים לקורס…</p>
    <noscript><a href="/he">המשיכו לאתר</a></noscript>
    <script>
      (function () {
        var fallback = "/he";
        var raw = location.hash.replace(/^#/, "") || "";
        if (!raw) {
          try {
            raw = new URLSearchParams(location.search).get("next") || "";
          } catch (e2) {}
        }
        try {
          raw = decodeURIComponent(raw);
        } catch (e) {}
        raw = (raw.split("?")[0] || "").split("#")[0];
        var ok =
          /^\/(he|en)(\/.*)?$/.test(raw) &&
          raw.indexOf("//") === -1 &&
          raw.indexOf("..") === -1 &&
          raw.indexOf("\\") === -1;
        location.replace(ok ? raw : fallback);
      })();
    </script>
  </body>
</html>
